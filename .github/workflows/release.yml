name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pomodoro-linux
            binary: target/release/pomodoro

          - os: windows-latest
            artifact_name: pomodoro-windows
            binary: target/release/pomodoro.exe

          - os: macos-latest
            artifact_name: pomodoro-macos
            binary: target/release/pomodoro

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary }}
